{% extends 'base.html' %}{% block conteudo %}<h1>Movimentações</h1><article><form method="get" class="linhas"><label>Nome<input name="nome" value="{{ nome }}"></label><label>Data<input name="data" type="date" value="{{ data }}"></label><button>Filtrar</button></form><table><tr><th>Data/hora</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Responsável</th></tr>{% for m in registros %}<tr><td>{{ m.data_hora }}</td><td>{{ m.produto }}</td><td>{{ m.tipo }}</td><td>{{ m.quantidade }}</td><td>{{ m.usuario }}</td></tr>{% else %}<tr><td colspan="5">Sem movimentações.</td></tr>{% endfor %}</table></article>{% endblock %}
